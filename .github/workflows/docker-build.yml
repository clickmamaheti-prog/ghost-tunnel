name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to Railway + wait + notify via ntfy ──────────────────────
  deploy-and-notify:
    name: Deploy & Notify
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      RAILWAY_TOKEN:    ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_ID:       ${{ secrets.RAILWAY_SERVICE_ID }}
      ENVIRONMENT_ID:   ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
      NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
      PROJECT_ID:       ${{ secrets.RAILWAY_PROJECT_ID }}

    steps:
      # ── 2a. Trigger Railway redeploy ────────────────────────────────────────
      - name: Trigger Railway service redeploy
        run: |
          echo "🚀 Triggering Railway redeploy..."
          RESPONSE=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://backboard.railway.app/graphql/v2 \
            --data "{\"query\":\"mutation { serviceInstanceDeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENVIRONMENT_ID\\\") }\"}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"serviceInstanceDeploy":true'; then
            echo "✅ Railway redeploy triggered"
          else
            echo "❌ Railway redeploy failed"
            exit 1
          fi

      # ── 2b. Wait for deployment to succeed + parse bore port ───────────────
      - name: Wait for deployment & get bore port
        id: bore
        run: |
          echo "⏳ Waiting for Railway deployment..."
          BORE_PORT=""
          DEPLOY_ID=""
          MAX_WAIT=180
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))

            # Get latest deployment
            RESULT=$(curl -s --max-time 15 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST https://backboard.railway.app/graphql/v2 \
              --data "{\"query\":\"{ deployments(input: { projectId: \\\"$PROJECT_ID\\\", serviceId: \\\"$SERVICE_ID\\\" }, first: 1) { edges { node { id status } } } }\"}")

            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['deployments']['edges'][0]['node']['status'])" 2>/dev/null || echo "UNKNOWN")
            DEPLOY_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['deployments']['edges'][0]['node']['id'])" 2>/dev/null || echo "")
            echo "[$ELAPSED s] Status: $STATUS | Deploy: $DEPLOY_ID"

            if [ "$STATUS" = "SUCCESS" ] && [ -n "$DEPLOY_ID" ]; then
              echo "✅ Deployment succeeded!"
              # Parse bore port from logs
              sleep 5
              LOGS=$(curl -s --max-time 15 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST https://backboard.railway.app/graphql/v2 \
                --data "{\"query\":\"{ deploymentLogs(deploymentId: \\\"$DEPLOY_ID\\\") { message } }\"}")
              BORE_PORT=$(echo "$LOGS" | python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          logs = [l['message'] for l in d['data']['deploymentLogs']]
          for msg in logs:
              m = re.search(r'bore\.pub:(\d+)', msg)
              if m and 'listening at' in msg.lower():
                  print(m.group(1))
                  break
          " 2>/dev/null || echo "")
              echo "BORE_PORT=${BORE_PORT}"
              break
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              exit 1
            fi
          done

          echo "bore_port=${BORE_PORT}" >> $GITHUB_OUTPUT
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT

      # ── 2c. Send ntfy notification from GitHub Actions ─────────────────────
      - name: Send ntfy notification
        if: success()
        run: |
          BORE_PORT="${{ steps.bore.outputs.bore_port }}"
          if [ -z "$BORE_PORT" ] || [ "$BORE_PORT" = "None" ]; then
            BORE_PORT="(cek Railway logs)"
          fi

          TITLE="🚇 Ghost Tunnel UP"
          BODY="Ghost Tunnel aktif (deploy via GitHub Actions)

Tunnels:
  SSH: bore.pub:${BORE_PORT}

SSH command:
  ssh root@bore.pub -p ${BORE_PORT}

Commit: ${{ github.sha }}
Repo: ${{ github.repository }}"

          CODE=$(curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: ${TITLE}" \
            -H "Priority: high" \
            -H "Tags: white_check_mark,rocket" \
            -d "${BODY}" \
            -o /dev/null \
            -w "%{http_code}" \
            "https://ntfy.sh/${NTFY_TOPIC}")

          if [ "$CODE" = "200" ]; then
            echo "✅ ntfy notification sent to ntfy.sh/${NTFY_TOPIC}"
          else
            echo "⚠️ ntfy notification failed (HTTP $CODE) — non-fatal"
          fi

      # ── 2d. Send ntfy on failure ──────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: ❌ Ghost Tunnel Deploy FAILED" \
            -H "Priority: urgent" \
            -H "Tags: x,warning" \
            -d "Deploy gagal!
Repo: ${{ github.repository }}
Commit: ${{ github.sha }}
Cek GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null 2>&1 || true
