name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Job 1: Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Trigger Railway redeploy + notify ntfy ─────────────────────────
  deploy-and-notify:
    name: Deploy & Notify
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Railway service redeploy
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "Triggering Railway redeploy..."
          RESPONSE=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://backboard.railway.app/graphql/v2 \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENVIRONMENT_ID\\\") }\"}" || echo '{"error":"curl failed"}')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -qE '"serviceInstanceRedeploy":true|true'; then
            echo "Railway redeploy triggered OK"
          else
            echo "Railway trigger returned non-success (Railway may auto-deploy via webhook — continuing)"
          fi

      - name: Wait for Railway deployment and get bore port
        id: bore
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Waiting 90s for Railway to deploy new image..."
          sleep 90
          BORE_PORT=""
          for i in $(seq 1 12); do
            sleep 10
            echo "Check $i/12..."
            RESULT=$(curl -s --max-time 15 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST https://backboard.railway.app/graphql/v2 \
              -d "{\"query\":\"{ deployments(input: { projectId: \\\"$PROJECT_ID\\\", serviceId: \\\"$SERVICE_ID\\\" }, first: 1) { edges { node { id status } } } }\"}" || echo '{}')
            STATUS=$(echo "$RESULT" | node -e \
              "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d.data.deployments.edges[0].node.status)}catch(e){console.log('UNKNOWN')}")
            DEPLOY_ID=$(echo "$RESULT" | node -e \
              "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d.data.deployments.edges[0].node.id||'')}catch(e){console.log('')}")
            echo "Deploy status: $STATUS | id: $DEPLOY_ID"
            if [ "$STATUS" = "SUCCESS" ] && [ -n "$DEPLOY_ID" ]; then
              echo "Deploy succeeded — checking logs for bore port..."
              sleep 5
              LOGS=$(curl -s --max-time 15 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST https://backboard.railway.app/graphql/v2 \
                -d "{\"query\":\"{ deploymentLogs(deploymentId: \\\"$DEPLOY_ID\\\") { message } }\"}" || echo '{}')
              BORE_PORT=$(echo "$LOGS" | node -e \
                "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));const logs=(d.data.deploymentLogs||[]).map(l=>l.message);const line=logs.find(m=>m&&m.includes('bore.pub')&&m.includes('listening'));if(line){const m=line.match(/bore\.pub:(\d+)/);if(m){console.log(m[1]);process.exit(0)}}console.log('')}catch(e){console.log('')}" || echo "")
              break
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "Deployment failed: $STATUS"
              break
            fi
          done
          if [ -n "$BORE_PORT" ]; then
            echo "bore_port=$BORE_PORT" >> "$GITHUB_OUTPUT"
            echo "Got bore port: $BORE_PORT"
          else
            echo "bore_port=" >> "$GITHUB_OUTPUT"
            echo "Could not determine bore port from logs"
          fi

      - name: Send ntfy notification (success)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ROOT_PASS: ${{ secrets.ROOT_PASS }}
        run: |
          BORE_PORT="${{ steps.bore.outputs.bore_port }}"
          if [ -z "$BORE_PORT" ]; then BORE_PORT="(cek Railway logs)"; fi
          PASS_DISPLAY="${ROOT_PASS:-Kosay378%}"
          BODY="$(printf '🖥️ c2026 Gost tunnel linux\n\n━━━━━━━━━━━━━━━━━━━━━━\n🟢 VPS Status : ONLINE\n⏱️ Deploy    : via GitHub Actions\n\n🌐 Host       : bore.pub\n🔐 SSH        : ssh root@bore.pub -p %s\n👤 User       : root\n🔑 Password   : %s\n\n━━━━━━━━━━━━━━━━━━━━━━\nCommit: %s' "$BORE_PORT" "$PASS_DISPLAY" "${{ github.sha }}")"
          CODE=$(curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: 🖥️ c2026 Gost tunnel linux" \
            -H "Priority: high" \
            -H "Tags: white_check_mark,rocket" \
            -d "$BODY" \
            -o /dev/null -w "%{http_code}" \
            "https://ntfy.sh/$NTFY_TOPIC")
          echo "ntfy HTTP: $CODE"
          [ "$CODE" = "200" ] && echo "ntfy sent OK" || echo "ntfy send failed (non-fatal)"

      - name: Send ntfy notification (failure)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          BODY="$(printf '🖥️ c2026 Gost tunnel linux\n\n━━━━━━━━━━━━━━━━━━━━━━\n❌ VPS Status : DEPLOY FAILED\n\n🔗 Cek log: %s/%s/actions/runs/%s\n━━━━━━━━━━━━━━━━━━━━━━' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
          curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: 🖥️ c2026 Gost tunnel linux" \
            -H "Priority: urgent" \
            -H "Tags: x,warning" \
            -d "$BODY" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null 2>&1 || true
