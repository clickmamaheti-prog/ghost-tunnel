name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Job 1: Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to Railway + wait + send ntfy ────────────────────────────
  deploy-and-notify:
    name: Deploy & Notify
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Railway service redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "Triggering Railway redeploy..."
          RESPONSE=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://backboard.railway.app/graphql/v2 \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENVIRONMENT_ID\\\") }\"}")
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"serviceInstanceDeploy":true'; then
            echo "Railway redeploy triggered OK"
          else
            echo "Railway redeploy failed"
            exit 1
          fi

      - name: Wait for deployment and get bore port
        id: bore
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Waiting for Railway deployment..."
          BORE_PORT=""
          DEPLOY_ID=""
          for i in $(seq 1 18); do
            sleep 10
            echo "Check $i/18..."
            RESULT=$(curl -s --max-time 15 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST https://backboard.railway.app/graphql/v2 \
              -d "{\"query\":\"{ deployments(input: { projectId: \\\"$PROJECT_ID\\\", serviceId: \\\"$SERVICE_ID\\\" }, first: 1) { edges { node { id status } } } }\"}")
            STATUS=$(echo "$RESULT" | node -e "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d.data.deployments.edges[0].node.status)}catch(e){console.log('UNKNOWN')}")
            DID=$(echo "$RESULT" | node -e "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(d.data.deployments.edges[0].node.id)}catch(e){console.log('')}")
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ] && [ -n "$DID" ]; then
              echo "Deployment succeeded! Getting bore port..."
              sleep 5
              LOGS=$(curl -s --max-time 15 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST https://backboard.railway.app/graphql/v2 \
                -d "{\"query\":\"{ deploymentLogs(deploymentId: \\\"$DID\\\") { message } }\"}")
              BORE_PORT=$(echo "$LOGS" | node -e "
                const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const logs=(d.data.deploymentLogs||[]).map(l=>l.message);
                const line=logs.find(m=>m.includes('listening at')&&m.includes('bore.pub'));
                if(line){const m=line.match(/bore\.pub:(\d+)/);if(m)console.log(m[1]);}
              " 2>/dev/null || echo "")
              echo "bore_port=$BORE_PORT" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "Deployment failed: $STATUS"
              exit 1
            fi
          done

      - name: Send ntfy notification (success)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          BORE_PORT="${{ steps.bore.outputs.bore_port }}"
          if [ -z "$BORE_PORT" ]; then BORE_PORT="(cek Railway logs)"; fi
          BODY="Ghost Tunnel aktif via GitHub Actions

SSH: ssh root@bore.pub -p ${BORE_PORT}

Commit: ${{ github.sha }}
Repo: ${{ github.repository }}"
          CODE=$(curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: Ghost Tunnel UP" \
            -H "Priority: high" \
            -H "Tags: white_check_mark,rocket" \
            -d "$BODY" \
            -o /dev/null -w "%{http_code}" \
            "https://ntfy.sh/$NTFY_TOPIC")
          echo "ntfy HTTP: $CODE"
          [ "$CODE" = "200" ] && echo "ntfy sent OK" || echo "ntfy failed (non-fatal)"

      - name: Send ntfy notification (failure)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS --max-time 30 \
            -H "Content-Type: text/plain" \
            -H "Title: Ghost Tunnel Deploy FAILED" \
            -H "Priority: urgent" \
            -H "Tags: x,warning" \
            -d "Deploy gagal! Cek: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null 2>&1 || true
