; ══════════════════════════════════════════════════════════════════════════════
;  Ghost Tunnel — Supervisor Main Configuration
;  /etc/supervisor/supervisord.conf
;  Supervisor runs as PID 1 and manages all services.
; ══════════════════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
childlogdir=/var/log/supervisor
; Strip ANSI escape codes from child logs
strip_ansi=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Auto-load all service definitions ─────────────────────────────────────────
; Drop *.conf files into /etc/supervisor/conf.d/ to add future services.
[include]
files=/etc/supervisor/conf.d/*.conf
