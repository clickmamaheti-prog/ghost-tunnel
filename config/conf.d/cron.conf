; ── Cron Daemon ───────────────────────────────────────────────────────────────
[program:cron]
command=/usr/sbin/cron -f -l 2
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
