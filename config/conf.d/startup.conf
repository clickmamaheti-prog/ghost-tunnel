; ── Startup Script (runs once at container start) ─────────────────────────────
; Handles: set root password, configure SSH port from $PORTS, regen SSH keys.
; startsecs=0 + autorestart=false so it runs exactly once and exits cleanly.
[program:startup]
command=/usr/local/bin/startup.sh
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=10
startretries=1
priority=5
stdout_logfile=/var/log/supervisor/startup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/startup-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
