; ── Ghost Tunnel (bore TCP tunnel manager) ────────────────────────────────────
; startretries=999 ensures the tunnel reconnects indefinitely on failure.
[program:tunnel]
command=/usr/local/bin/tunnel.sh
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
startretries=999
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
