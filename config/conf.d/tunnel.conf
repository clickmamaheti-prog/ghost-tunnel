; ── Ghost Tunnel (bore TCP tunnel manager) ────────────────────────────────────
; startretries=999 ensures the tunnel reconnects indefinitely on failure.
[program:tunnel]
command=/usr/local/bin/tunnel.sh
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
startretries=999
priority=30
stdout_logfile=/var/log/supervisor/tunnel.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/tunnel-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
