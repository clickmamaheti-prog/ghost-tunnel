; ── Health Check HTTP Server ──────────────────────────────────────────────────
[program:health]
command=python3 /usr/local/bin/health.py
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
startretries=5
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
